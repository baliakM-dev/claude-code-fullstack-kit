name: Validate kit

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate repository structure
        run: python scripts/validate_kit.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Verify shipped Java example
        run: python .claude/skills/spring-backend/scripts/verify_java_examples.py
